spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 24h
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
app:
  allowed-origin: ${APP_ALLOWED_ORIGIN}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  phone:
    encryption-key: ${APP_PHONE_ENCRYPTION_KEY}
    lookup-key: ${APP_PHONE_LOOKUP_KEY}
  customer-phone:
    encryption-key: ${APP_CUSTOMER_PHONE_ENCRYPTION_KEY}
    lookup-key: ${APP_CUSTOMER_PHONE_LOOKUP_KEY}
  coupon-code:
    encryption-key: ${APP_COUPON_CODE_ENCRYPTION_KEY}
    mac-key: ${APP_COUPON_CODE_MAC_KEY}
  quota:
    monthly-message-limit: ${APP_MONTHLY_MESSAGE_LIMIT}

solapi:
  send-enabled: ${SOLAPI_SEND_ENABLED:false}
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  from-number: ${SOLAPI_FROM_NUMBER:}
  webhook-secret: ${SOLAPI_WEBHOOK_SECRET:}
  allowed-recipients: ${SOLAPI_ALLOWED_RECIPIENTS:}
  allow-all-recipients: ${SOLAPI_ALLOW_ALL_RECIPIENTS:false}
  count-delivery-failures: ${SOLAPI_COUNT_DELIVERY_FAILURES:true}
  max-sends-per-run: ${SOLAPI_MAX_SENDS_PER_RUN:1}
  background-enabled: ${SOLAPI_BACKGROUND_ENABLED:true}
