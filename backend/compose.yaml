services:
  db:
    image: postgres:17-alpine
    ports: 
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: coupon_hanjang
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon_hanjang"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coupon_hanjang
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:?Set APP_ALLOWED_ORIGIN in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_PHONE_ENCRYPTION_KEY: ${APP_PHONE_ENCRYPTION_KEY:?Set APP_PHONE_ENCRYPTION_KEY in .env}
      APP_PHONE_LOOKUP_KEY: ${APP_PHONE_LOOKUP_KEY:?Set APP_PHONE_LOOKUP_KEY in .env}
      APP_CUSTOMER_PHONE_ENCRYPTION_KEY: ${APP_CUSTOMER_PHONE_ENCRYPTION_KEY:?Set APP_CUSTOMER_PHONE_ENCRYPTION_KEY in .env}
      APP_CUSTOMER_PHONE_LOOKUP_KEY: ${APP_CUSTOMER_PHONE_LOOKUP_KEY:?Set APP_CUSTOMER_PHONE_LOOKUP_KEY in .env}
      APP_COUPON_CODE_ENCRYPTION_KEY: ${APP_COUPON_CODE_ENCRYPTION_KEY:?Set APP_COUPON_CODE_ENCRYPTION_KEY in .env}
      APP_COUPON_CODE_MAC_KEY: ${APP_COUPON_CODE_MAC_KEY:?Set APP_COUPON_CODE_MAC_KEY in .env}
      APP_MONTHLY_MESSAGE_LIMIT: ${APP_MONTHLY_MESSAGE_LIMIT:?Set APP_MONTHLY_MESSAGE_LIMIT in .env}
      SOLAPI_SEND_ENABLED: ${SOLAPI_SEND_ENABLED:-false}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_FROM_NUMBER: ${SOLAPI_FROM_NUMBER:-}
      SOLAPI_WEBHOOK_SECRET: ${SOLAPI_WEBHOOK_SECRET:-}
      SOLAPI_ALLOWED_RECIPIENTS: ${SOLAPI_ALLOWED_RECIPIENTS:-}
      SOLAPI_ALLOW_ALL_RECIPIENTS: ${SOLAPI_ALLOW_ALL_RECIPIENTS:-false}
      SOLAPI_COUNT_DELIVERY_FAILURES: ${SOLAPI_COUNT_DELIVERY_FAILURES:-true}
      SOLAPI_MAX_SENDS_PER_RUN: ${SOLAPI_MAX_SENDS_PER_RUN:-1}
      SOLAPI_BACKGROUND_ENABLED: ${SOLAPI_BACKGROUND_ENABLED:-true}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
